<!-- HTML MÓDULO RECORDATORIOS -->
<div class="panel-contenido">
  <div class="panel-header">
    <h2 class="panel-title">Recordatorios</h2>
  </div>

  <div class="add-recordatorio">
    <input type="text" class="neu-input" placeholder="Escribe un nuevo recordatorio...">
    <button class="btn-primary btn-pill">+</button>
  </div>

  <div class="panel-body">
    <div class="recordatorio-item">
      <label class="neu-checkbox-container">
        <input type="checkbox">
        <span class="neu-checkmark"></span>
      </label>
      <span class="recordatorio-text">Enviar factura a Cliente X</span>
    </div>

    <div class="recordatorio-item">
      <label class="neu-checkbox-container">
        <input type="checkbox">
        <span class="neu-checkmark"></span>
      </label>
      <span class="recordatorio-text">Llamar al proveedor de papelería</span>
    </div>
  </div>
</div>
