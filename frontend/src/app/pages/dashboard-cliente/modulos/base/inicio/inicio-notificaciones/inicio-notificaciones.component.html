<!-- HTML MÓDULO NOTIFICACIONES -->
<div class="panel-contenido">
  <div class="panel-header">
    <h2 class="panel-title">Feed de Notificaciones</h2>
  </div>

  <div class="panel-body">
    <!-- Notificación tipo Alerta -->
    <div class="notificacion-item border-warning">
      <div class="noti-icon bg-warning">!</div>
      <div class="noti-content">
        <p class="noti-text">Tienes 3 tareas atrasadas.</p>
        <span class="noti-time">Hace 10 min</span>
      </div>
    </div>

    <!-- Notificación tipo Info -->
    <div class="notificacion-item border-info">
      <div class="noti-icon bg-info">i</div>
      <div class="noti-content">
        <p class="noti-text">Nuevo cliente registrado en el sistema.</p>
        <span class="noti-time">Hace 1 hora</span>
      </div>
    </div>
    
    <!-- Notificación tipo Éxito -->
    <div class="notificacion-item border-success">
      <div class="noti-icon bg-success">✓</div>
      <div class="noti-content">
        <p class="noti-text">Pago de nómina procesado.</p>
        <span class="noti-time">Ayer</span>
      </div>
    </div>
  </div>
</div>
