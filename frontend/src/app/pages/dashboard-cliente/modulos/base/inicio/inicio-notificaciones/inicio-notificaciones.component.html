<div>
  <h3>Mis Notificaciones</h3>
  <div *ngIf="cargando">Cargando...</div>

  <ul style="list-style: none; padding: 0;" *ngIf="!cargando">
    <li *ngFor="let n of notificaciones" 
        [style.background]="n.leida ? '#f9f9f9' : '#e6f7ff'"
        style="margin-bottom: 5px; border: 1px solid #ccc; padding: 10px;">
      
      <strong>{{ n.titulo }}</strong> <span *ngIf="!n.leida" style="color: red; font-size: 10px;">(Nueva)</span>
      <div style="font-size: 12px;">{{ n.mensaje }}</div>
      
      <button *ngIf="!n.leida" (click)="marcarLeida(n.id)" style="font-size: 10px; margin-top: 5px;">
        Marcar como leída
      </button>
    </li>
    
    <li *ngIf="notificaciones.length === 0">
      No tienes notificaciones.
    </li>
  </ul>
</div>
