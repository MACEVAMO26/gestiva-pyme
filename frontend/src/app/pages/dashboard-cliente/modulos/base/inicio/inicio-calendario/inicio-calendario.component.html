<!-- HTML MÓDULO CALENDARIO -->
<div class="panel-contenido">
  <div class="panel-header">
    <h2 class="panel-title">Calendario Personal</h2>
    <div class="month-selector">Agosto 2026</div>
  </div>

  <div class="panel-body">
    <!-- Grilla del calendario -->
    <div class="calendar-grid">
      <!-- Días de la semana -->
      <div class="weekday">Lun</div><div class="weekday">Mar</div><div class="weekday">Mié</div>
      <div class="weekday">Jue</div><div class="weekday">Vie</div><div class="weekday">Sáb</div><div class="weekday">Dom</div>
      
      <!-- Días vacíos -->
      <div class="day-cell empty"></div><div class="day-cell empty"></div><div class="day-cell empty"></div><div class="day-cell empty"></div><div class="day-cell empty"></div>
      
      <!-- Días interactivos (Del 1 al 31) -->
      <div class="day-cell" (click)="abrirModal()">1</div>
      <div class="day-cell" (click)="abrirModal()">2</div>
      <div class="day-cell has-event" (click)="abrirModal()">3</div>
      <!-- Simplificado para visualización -->
      <div class="day-cell" (click)="abrirModal()">4</div>
      <div class="day-cell" (click)="abrirModal()">5</div>
      <div class="day-cell" (click)="abrirModal()">6</div>
      <div class="day-cell" (click)="abrirModal()">7</div>
      <div class="day-cell today" (click)="abrirModal()">8</div>
      <div class="day-cell" (click)="abrirModal()">9</div>
    </div>
  </div>
</div>

<!-- MODAL PARA CREAR EVENTO (Controlado por estado isModalOpen) -->
@if (isModalOpen) {
<div class="modal-overlay">
  <div class="modal-card neu-card">
    <div class="modal-header">
      <h2 class="panel-title">Nuevo Evento</h2>
      <button class="btn-close" (click)="cerrarModal()">×</button>
    </div>
    <div class="modal-body">
      <form>
        <div class="form-group">
          <label>Título del Evento</label>
          <input type="text" class="neu-input" placeholder="Ej. Presentación comercial">
        </div>
        <div class="form-group">
          <label>Descripción</label>
          <textarea class="neu-input" rows="3"></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-save btn-pill" (click)="guardarEvento()">Guardar Evento</button>
        </div>
      </form>
    </div>
  </div>
</div>
}
