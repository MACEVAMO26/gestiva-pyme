<!-- HTML MÓDULO CALENDARIO -->
<div class="module-container">
<div class="module-header">
    <h1>Calendario Personal</h1>
    <div class="month-selector" style="display: flex; align-items: center; justify-content: center; gap: 1rem;">
      <button class="btn-icon" (click)="mesAnterior()" title="Mes anterior" style="width: 24px; height: 24px; font-size: 10px;">◀</button>
      <span>{{ nombreMes }}</span>
      <button class="btn-icon" (click)="mesSiguiente()" title="Mes siguiente" style="width: 24px; height: 24px; font-size: 10px;">▶</button>
    </div>
  </div>

  <div class="panel-body">
    <!-- Grilla del calendario -->
    <div class="calendar-grid">
      <!-- Días de la semana -->
      @for (dia of diasSemana; track dia) {
        <div class="weekday">{{ dia }}</div>
      }
      
      <!-- Días vacíos -->
      @for (vacio of diasVacios; track $index) {
        <div class="day-cell empty"></div>
      }
      
      <!-- Días interactivos (Del 1 al 31) -->
      @for (dia of diasDelMes; track dia.dia) {
        <div class="day-cell" 
             [class.today]="dia.hoy" 
             [class.has-event]="dia.evento" 
             (click)="abrirModal()">
          {{ dia.dia }}
        </div>
      }
    </div>
  </div>
</div>

<!-- MODAL PARA CREAR EVENTO (Controlado por estado isModalOpen) -->
@if (isModalOpen) {
<div class="modal-overlay">
  <div class="modal-card neumorphic-panel">
    <div class="modal-header">
      <h1>Nuevo Evento</h1>
      <button class="btn-close" (click)="cerrarModal()">×</button>
    </div>
    <div class="modal-body">
      <form>
        <div class="form-group">
          <label>Título del Evento</label>
          <input type="text" class="input-neumorphic" [(ngModel)]="eventoForm.titulo" name="titulo" placeholder="Ej. Presentación comercial">
        </div>
        <div class="form-group">
          <label>Descripción</label>
          <textarea class="input-neumorphic" rows="3" [(ngModel)]="eventoForm.descripcion" name="descripcion"></textarea>
        </div>
        <div class="form-group">
          <label>Fecha</label>
          <input type="date" class="input-neumorphic" [(ngModel)]="eventoForm.fecha" name="fecha">
        </div>
        <div class="form-actions">
          <button type="button" class="btn-volver btn-pill" (click)="cerrarModal()">Cancelar</button>
          <button type="button" class="btn-save btn-pill" (click)="guardarEvento()">Guardar Evento</button>
        </div>
      </form>
    </div>
  </div>
</div>
}
