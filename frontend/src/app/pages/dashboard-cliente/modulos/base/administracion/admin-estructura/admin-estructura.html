<!-- HTML GESTIÓN DE ESTRUCTURA ORGANIZACIONAL -->
<div class="panel-contenido">
  <div class="panel-header">
    <h2 class="panel-title">Estructura Organizacional</h2>
  </div>

  <div class="estructura-grid">
    <!-- Sedes -->
    <div class="est-card neu-inset">
      <div class="est-header">
        <h3>📍 Sedes</h3>
        <button class="btn-icon-add">+</button>
      </div>
      <ul class="est-list">
        <li>Sede Principal - Bogotá</li>
        <li>Sede Norte - Medellín</li>
      </ul>
    </div>

    <!-- Áreas (Departamentos) -->
    <div class="est-card neu-inset">
      <div class="est-header">
        <h3>🏢 Áreas (Departamentos)</h3>
        <button class="btn-icon-add">+</button>
      </div>
      <ul class="est-list">
        <li>Recursos Humanos</li>
        <li>Ventas Corporativas</li>
        <li>Contabilidad</li>
      </ul>
    </div>

    <!-- Cargos -->
    <div class="est-card neu-inset">
      <div class="est-header">
        <h3>👔 Cargos</h3>
        <button class="btn-icon-add">+</button>
      </div>
      <ul class="est-list">
        <li>Gerente General</li>
        <li>Asesor Comercial</li>
      </ul>
    </div>

    <!-- Jerarquías -->
    <div class="est-card neu-inset">
      <div class="est-header">
        <h3>📈 Jerarquías</h3>
        <button class="btn-icon-add">+</button>
      </div>
      <ul class="est-list">
        <li>Nivel 1 (Directivo)</li>
        <li>Nivel 2 (Operativo)</li>
      </ul>
    </div>
  </div>
</div>
