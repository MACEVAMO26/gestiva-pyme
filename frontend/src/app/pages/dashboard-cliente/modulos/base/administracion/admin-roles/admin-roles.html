<!-- HTML GESTIÓN DE ROLES Y ACCESOS -->
<div class="panel-contenido">
  <div class="panel-header">
    <h2 class="panel-title">Roles y Accesos</h2>
    <button class="btn-primary btn-pill" (click)="abrirModal()">+ Nuevo Rol</button>
  </div>
  <div class="panel-body">
    <div class="neu-table-container">
      <table class="neu-table">
        <thead><tr><th>Rol</th><th>Descripción</th><th>Acciones</th></tr></thead>
        <tbody>
          <tr><td>Gerente</td><td>Acceso total al sistema</td><td><button class="btn-icon">✏️</button></td></tr>
          <tr><td>Asesor</td><td>Acceso limitado a ventas</td><td><button class="btn-icon">✏️</button></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

@if (isModalOpen) {
<div class="modal-overlay">
  <div class="modal-card neu-card">
    <div class="modal-header">
      <h2 class="panel-title">Crear/Editar Rol</h2>
      <button class="btn-close" (click)="cerrarModal()">×</button>
    </div>
    <div class="modal-body">
      <form>
        <div class="form-group full-width"><label>Nombre del Rol</label><input type="text" class="neu-input"></div>
        <div class="form-group full-width"><label>Descripción</label><input type="text" class="neu-input"></div>
        
        <label class="section-label">Accesos por Área</label>
        <div class="permissions-grid">
          <label class="neu-checkbox-container">
            <input type="checkbox"><span class="neu-checkmark"></span>
            <span class="perm-text">Área Ventas</span>
          </label>
          <label class="neu-checkbox-container">
            <input type="checkbox"><span class="neu-checkmark"></span>
            <span class="perm-text">Área Contable</span>
          </label>
          <label class="neu-checkbox-container">
            <input type="checkbox"><span class="neu-checkmark"></span>
            <span class="perm-text">Área RRHH</span>
          </label>
        </div>

        <div class="form-actions"><button type="button" class="btn-save btn-pill" (click)="guardar()">Guardar Rol</button></div>
      </form>
    </div>
  </div>
</div>
}
