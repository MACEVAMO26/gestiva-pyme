<div class="module-container fade-in">
  <div class="module-header text-center mb-4 relative">
    <h1>Reportes y Analíticas de Servicios</h1>
    <p>Visualice las métricas de eficiencia de los técnicos y servicios más solicitados.</p>
  </div>

  <div class="tab-content neumorphic-panel-inner p-4">
    <div class="volver-wrapper">
      <button class="btn-volver btn-pill" onclick="window.history.back()">
        <i class="fas fa-arrow-left"></i> Volver
      </button>
    </div>

    <div class="neumorphic-panel fade-in">
      <h2 class="subtitulo">Filtros de Reporte</h2>
      <form>
        <div class="form-grid" style="align-items: end;">
          <div class="form-group">
            <label class="form-label">Desde:</label>
            <input type="date" class="input-neumorphic">
          </div>
          <div class="form-group">
            <label class="form-label">Hasta:</label>
            <input type="date" class="input-neumorphic">
          </div>
          <div class="form-group" style="padding-bottom: 0.2rem;">
            <button type="button" class="btn-general-2 btn-pill">Generar Reporte</button>
          </div>
        </div>
      </form>

      <div class="mt-4">
        <h2 class="subtitulo">Métricas Principales</h2>
        <div class="metrics-grid">
          
          <div class="neumorphic-panel-inner text-center">
            <p class="metric-label">Total de Tickets Atendidos</p>
            <strong class="metric-value-accent">0</strong>
          </div>

          <div class="neumorphic-panel-inner text-center">
            <p class="metric-label">Técnico con más servicios</p>
            <strong class="metric-value">N/A</strong>
          </div>

          <div class="neumorphic-panel-inner text-center">
            <p class="metric-label">Servicio más demandado</p>
            <strong class="metric-value">N/A</strong>
          </div>

          <div class="neumorphic-panel-inner text-center">
            <p class="metric-label">Promedio de tiempo</p>
            <strong class="metric-value-danger">0 hrs</strong>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
