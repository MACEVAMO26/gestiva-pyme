<div class="module-container fade-in">
  <div class="module-header text-center mb-4 relative">
    <h1>CRM - Gestión de Clientes</h1>
    <p>Vista 360º de las interacciones, tickets y servicios prestados a los clientes.</p>
  </div>

  <div class="tab-content neumorphic-panel-inner p-4">
    <div class="volver-wrapper">
      <button class="btn-volver btn-pill" onclick="window.history.back()">
        <i class="fas fa-arrow-left"></i> Volver
      </button>
    </div>

    <div class="neumorphic-panel fade-in">
      <h2 class="subtitulo">Buscador de Clientes</h2>
      <form>
        <div class="form-grid" style="align-items: end;">
          <div class="form-group full-width">
            <label class="form-label">Buscar por Nombre o Documento:</label>
            <input type="text" class="input-neumorphic" placeholder="Ej. Juan Pérez">
          </div>
          <div class="form-group" style="padding-bottom: 0.2rem;">
            <button type="button" class="btn-general-1 btn-pill">Buscar</button>
          </div>
        </div>
      </form>

      <div class="mt-4">
        <h2 class="subtitulo">Historial Reciente de Servicios</h2>
        <p class="text-muted" style="font-size: 12px; margin-top: 1rem;">Seleccione un cliente para ver su historial de servicios técnicos y visitas.</p>
      </div>
    </div>
  </div>
</div>
