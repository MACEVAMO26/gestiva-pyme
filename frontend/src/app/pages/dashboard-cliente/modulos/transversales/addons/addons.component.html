<div class="module-container fade-in">
  <div class="module-header text-center mb-4 relative">
    <h1>Addons</h1>
    <p>Extensiones y módulos adicionales para tu empresa.</p>
  </div>

  <div class="tab-content neumorphic-panel-inner p-4">
    <!-- 1. The Volver button MUST be here, right under the neumorphic-panel-inner, OUTSIDE any elevated panels -->
    <div class="volver-wrapper">
      <button class="btn-volver btn-pill" onclick="window.history.back()">
        <i class="fas fa-arrow-left"></i> Volver
      </button>
    </div>

    <!-- 2. The actual content of the module -->
    <div class="neumorphic-panel fade-in">
      <div class="empty-addons" style="text-align: center; padding: 3rem;">
        <div class="addons-icon" style="font-size: 3rem; margin-bottom: 1rem; color: #45a1ae;">
          <i class="fas fa-puzzle-piece"></i>
        </div>
        <h2 class="subtitulo addons-title">En Construcción</h2>
        <p class="text-muted">Este módulo está en desarrollo. Pronto podrás activar extensiones para potenciar tu gestión.</p>
      </div>
    </div>
  </div>
</div>
